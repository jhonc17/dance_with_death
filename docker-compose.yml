services:
  postgres:
    image: postgres:16-alpine
    container_name: ${POSTGRES_CONTAINER_NAME:-dwd-postgres}
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-dance_with_death}
      POSTGRES_USER: ${DB_USERNAME:-dance}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-dance_secret}
      TZ: UTC
      PGTZ: UTC
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ${POSTGRES_DATA_PATH:-./data/postgres}:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-dance} -d ${DB_DATABASE:-dance_with_death}"]
      interval: 5s
      timeout: 5s
      retries: 10
    labels:
      - com.dwd.app=dance-with-death
      - com.dwd.service=postgres
      - com.dwd.deploy_id=${DEPLOY_ID:-local}

  backend:
    build:
      context: ./backend
    image: dwd-backend:${DEPLOY_ID:-local}
    container_name: ${BACKEND_CONTAINER_NAME:-dwd-backend}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env.local
    environment:
      APP_NAME: ${APP_NAME:-Dance with Death}
      APP_ENV: ${APP_ENV:-local}
      APP_KEY: ${APP_KEY}
      APP_DEBUG: ${APP_DEBUG:-true}
      APP_URL: ${APP_URL:-http://localhost:8000}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      APP_TIMEZONE: ${APP_TIMEZONE:-UTC}
      DB_CONNECTION: pgsql
      DB_HOST: ${DB_HOST:-postgres}
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-dance_with_death}
      DB_USERNAME: ${DB_USERNAME:-dance}
      DB_PASSWORD: ${DB_PASSWORD:-dance_secret}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      CACHE_STORE: ${CACHE_STORE:-file}
      MAIL_MAILER: ${MAIL_MAILER:-log}
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_SCHEME: ${MAIL_SCHEME:-smtp}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-noreply@dancewithdeath.test}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-${APP_NAME:-Dance with Death}}
    ports:
      - "${BACKEND_PORT:-8000}:80"
    labels:
      - com.dwd.app=dance-with-death
      - com.dwd.service=backend
      - com.dwd.deploy_id=${DEPLOY_ID:-local}

  frontend:
    build:
      context: ./frontend
      args:
        NUXT_PUBLIC_API_BASE: ${NUXT_PUBLIC_API_BASE:-http://localhost:8000/api}
    image: dwd-frontend:${DEPLOY_ID:-local}
    container_name: ${FRONTEND_CONTAINER_NAME:-dwd-frontend}
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    labels:
      - com.dwd.app=dance-with-death
      - com.dwd.service=frontend
      - com.dwd.deploy_id=${DEPLOY_ID:-local}
